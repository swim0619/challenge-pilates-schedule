<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>시간표 | 챌린지필라테스 관리</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="챌린지필라테스">
<meta name="theme-color" content="#d63a2f">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="logo">챌린지<span>필라테스</span></div>
    <nav class="admin-nav">
      <a href="index.html">대시보드</a>
      <a href="todos.html">할일</a>
      <a href="schedule.html">시간표</a>
      <a href="members.html">회원관리</a>
      <a href="workouts.html">운동일지</a>
      <a href="revenue.html" class="owner-only">매출관리</a>
      <a href="instructors.html" class="owner-only">강사관리</a>
    </nav>
    <div class="sidebar-footer">
      <div class="who" data-who>-</div>
      <span class="role-badge" data-role-badge>-</span>
      <button class="btn btn-outline btn-sm" data-logout>로그아웃</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>시간표</h1>
      <button class="btn btn-primary owner-only" id="new-class-btn" type="button">+ 새 수업</button>
    </div>

    <div class="card hidden owner-only" id="class-form-wrap">
      <h2 id="class-form-title">새 수업 등록</h2>
      <form id="class-form">
        <input type="hidden" name="id">

        <div class="form-row">
          <div class="field" id="member-field" style="flex:2; min-width:200px;">
            <label>회원 (선택사항)</label>
            <select name="member_id"><option value="">선택 안 함 (개인 일정)</option></select>
          </div>
          <div class="field" style="align-self:center; padding-top:1.6em;">
            <label class="checkbox-inline">
              <input type="checkbox" name="is_trial" id="is-trial-checkbox">
              체험수업 (신규 회원 자동 등록)
            </label>
          </div>
        </div>

        <div class="form-row hidden" id="trial-name-field">
          <div class="field" style="flex:1; min-width:160px;">
            <label>체험 회원 이름</label>
            <input type="text" name="trial_name" placeholder="이름">
          </div>
          <div class="field" id="trial-phone-field" style="flex:1; min-width:160px;">
            <label>연락처 (선택)</label>
            <input type="text" name="trial_phone" placeholder="010-0000-0000">
          </div>
        </div>

        <div class="form-row">
          <div class="field" style="flex:3; min-width:200px;">
            <label>제목</label>
            <input type="text" name="title" placeholder="예: 개인 일정, 청소 등 (회원/체험 선택 시 자동 입력)">
          </div>
        </div>

        <div class="form-row">
          <div class="field" style="flex:1; min-width:140px;"><label>날짜</label><input type="date" name="class_date" required></div>
          <div class="field" style="flex:1; min-width:140px;"><label>시작 시간</label><input type="text" name="start_time" placeholder="예: 07:00" required></div>
          <div class="field" style="flex:1; min-width:140px;">
            <label>담당 강사</label>
            <select name="instructor_id"><option value="">미배정</option></select>
          </div>
        </div>

        <div class="form-row">
          <div class="field" id="repeat-weekly-field" style="align-self:center;">
            <label class="checkbox-inline">
              <input type="checkbox" name="repeat_weekly" id="repeat-weekly-checkbox">
              매주 반복 (고정 수업)
            </label>
          </div>
          <div class="field hidden" id="repeat-weeks-field" style="flex:1; min-width:140px; max-width:200px;">
            <label>몇 주 동안 반복할까요?</label>
            <input type="text" inputmode="numeric" pattern="[0-9]*" name="repeat_weeks" value="8">
          </div>
        </div>

        <div class="form-row">
          <div class="field" style="display:flex; gap:8px;">
            <button class="btn btn-primary" type="submit">저장</button>
            <button class="btn btn-outline" type="button" id="cancel-class-form">취소</button>
          </div>
        </div>
      </form>
    </div>

    <div class="card">
      <div class="flex-between mt-16" style="margin-top:0;">
        <div class="view-tabs">
          <button type="button" class="active" data-view-btn="week">주간</button>
          <button type="button" data-view-btn="month">월간</button>
        </div>
        <div class="month-nav" id="week-nav">
          <button class="btn btn-outline btn-sm" type="button" id="prev-week">‹ 이전주</button>
          <strong id="week-label" style="min-width:150px; text-align:center; display:inline-block;"></strong>
          <button class="btn btn-outline btn-sm" type="button" id="next-week">다음주 ›</button>
        </div>
        <div class="month-nav hidden" id="month-nav">
          <button class="btn btn-outline btn-sm" type="button" id="prev-month">‹ 이전달</button>
          <strong id="month-label" style="min-width:110px; text-align:center; display:inline-block;"></strong>
          <button class="btn btn-outline btn-sm" type="button" id="next-month">다음달 ›</button>
        </div>
      </div>
      <div id="schedule-body" class="mt-16"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/schedule.js"></script>
</body>
</html>
