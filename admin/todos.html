<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>할일 | 챌린지필라테스 관리</title>
<link rel="stylesheet" href="css/admin.css">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="logo">챌린지<span>필라테스</span></div>
    <nav class="admin-nav">
      <a href="index.html">대시보드</a>
      <a href="todos.html">할일</a>
      <a href="schedule.html">시간표</a>
      <a href="members.html">회원관리</a>
      <a href="workouts.html">운동일지</a>
      <a href="blog.html">블로그</a>
      <a href="revenue.html" class="owner-only">매출관리</a>
      <a href="instructors.html" class="owner-only">강사관리</a>
    </nav>
    <div class="sidebar-footer">
      <div class="who" data-who>-</div>
      <span class="role-badge" data-role-badge>-</span>
      <button class="btn btn-outline btn-sm" data-logout>로그아웃</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>할일</h1>
      <div style="display:flex; align-items:center; gap:10px;">
        <span class="today" id="today-label"></span>
        <input type="date" id="todo-date-input" style="padding:.5em .7em; border:1.5px solid var(--border); border-radius:8px;">
        <button class="btn btn-outline btn-sm" type="button" id="todo-today-btn">오늘</button>
      </div>
    </div>

    <div class="view-tabs mt-16" id="todo-category-tabs">
      <button type="button" data-category="all" class="active">전체</button>
      <button type="button" data-category="personal">개인</button>
      <button type="button" data-category="pilates">필라테스</button>
      <button type="button" data-category="swim">수영</button>
      <button type="button" data-category="study">공부</button>
      <button type="button" data-category="workout">운동</button>
    </div>

    <div class="card">
      <form id="todo-form" style="display:flex; gap:8px;">
        <input name="content" placeholder="할일을 입력하세요" required style="flex:1; padding:.7em .9em; border:1.5px solid var(--border); border-radius:10px;">
        <select name="category" style="padding:.7em .9em; border:1.5px solid var(--border); border-radius:10px;">
          <option value="personal">개인</option>
          <option value="pilates">필라테스</option>
          <option value="swim">수영</option>
          <option value="study">공부</option>
          <option value="workout">운동</option>
        </select>
        <button class="btn btn-primary" type="submit">추가</button>
      </form>

      <div id="todo-list" class="mt-16"></div>
    </div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/todos.js"></script>
</body>
</html>
