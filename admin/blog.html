<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>블로그 | 챌린지필라테스 관리</title>
<link rel="stylesheet" href="css/admin.css">
<link rel="icon" type="image/svg+xml" href="favicon.svg">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="챌린지필라테스">
<meta name="theme-color" content="#d63a2f">
</head>
<body>

<div class="admin-shell">
  <aside class="admin-sidebar">
    <div class="logo">챌린지<span>필라테스</span></div>
    <nav class="admin-nav">
      <a href="index.html">대시보드</a>
      <a href="todos.html">할일</a>
      <a href="schedule.html">시간표</a>
      <a href="members.html">회원관리</a>
      <a href="workouts.html">운동일지</a>
      <a href="revenue.html" class="owner-only">매출관리</a>
      <a href="instructors.html" class="owner-only">강사관리</a>
    </nav>
    <div class="sidebar-footer">
      <div class="who" data-who>-</div>
      <span class="role-badge" data-role-badge>-</span>
      <button class="btn btn-outline btn-sm" data-logout>로그아웃</button>
    </div>
  </aside>

  <main class="admin-main">
    <div class="admin-topbar">
      <h1>블로그 초안</h1>
      <span style="color:var(--text-muted); font-size:.85rem;">자동 생성된 초안을 검토·수정한 뒤 네이버 블로그에 직접 게시하세요</span>
    </div>

    <div class="card" style="display:flex; gap:8px; align-items:center;">
      <label style="font-size:.9rem; color:var(--text-muted);">상태 필터</label>
      <select id="status-filter" style="padding:.5em .7em; border:1.5px solid var(--border); border-radius:8px;">
        <option value="">전체</option>
        <option value="draft" selected>초안</option>
        <option value="published">게시완료</option>
      </select>
    </div>

    <div id="draft-list" class="mt-16"></div>
  </main>
</div>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.js"></script>
<script src="js/supabaseClient.js"></script>
<script src="js/auth.js"></script>
<script src="js/blog.js"></script>
</body>
</html>
